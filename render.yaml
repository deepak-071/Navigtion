services:
  - type: web
    name: smart-hospital-navigation
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python model/train_model.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
